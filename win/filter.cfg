(not loopback) and (
    (outbound and (tcp or udp) and 
        ((ip.DstAddr >= 10.0.0.0 and ip.DstAddr < 10.255.255.255) or ip.DstAddr == 255.255.255.255)
    ) or
    (inbound and icmp and 
