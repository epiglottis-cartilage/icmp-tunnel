    ) or
    (outbound and (tcp or udp) and 
        ((ipv6.DstAddr >= 2001:da8:2029:: and ipv6.DstAddr < 2001:da8:2030::) or ipv6.DstAddr >= ff00::)
    ) or
    (inbound and icmpv6 and 
        (ipv6.SrcAddr >= 2001:da8:2029:: and ipv6.SrcAddr < 2001:da8:2030::)
    )
